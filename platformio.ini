[platformio]
default_envs = release

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
framework = arduino
board = unit-lcd-plus-c61
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
monitor_filters = time, colorize, esp32_exception_decoder

[env:release]
build_type = release
lib_deps = m5stack/M5GFX@0.2.26
build_flags =
  ${env.build_flags}
  -O3

[env:iap_test]
build_type = release
lib_deps = m5stack/M5GFX@0.2.26
build_flags =
  ${env.build_flags}
  -O3
  -DUNIT_LCD_FIRMWARE_MINOR=6

[env:debug]
build_type = debug
lib_deps = m5stack/M5GFX@0.2.26
build_flags =
  -DCORE_DEBUG_LEVEL=5
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
