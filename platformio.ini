[platformio]
default_envs = release

[env]
framework = arduino
lib_deps = m5stack/M5GFX@0.2.27

[target_c61]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
; A plain Arduino build does not integrate the ESP32-C61 precompiled libraries
; on its own; see tools/ensure_c61_libs.py.
extra_scripts = pre:tools/ensure_c61_libs.py
board = unit-lcd-plus-c61
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, colorize, esp32_exception_decoder

[target_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = m5stick-c
; pioarduino 55.03.36 renamed the Arduino variant from m5stick_c.
board_build.variant = m5stack_stickc
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 1500000
monitor_filters = time, colorize, esp32_exception_decoder

[env:release]
extends = target_c61
build_type = release
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -O3

[env:debug]
extends = target_c61
build_type = debug
build_flags =
  -DCORE_DEBUG_LEVEL=5
  -DDEBUG=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:iap_test]
extends = target_c61
build_type = release
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -O3
  -DUNIT_LCD_FIRMWARE_VERSION=6

[env:esp32_release]
extends = target_esp32
build_type = release
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -O3

[env:esp32_iap_test]
extends = target_esp32
build_type = release
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -O3
  -DUNIT_LCD_FIRMWARE_VERSION=6

[env:esp32_debug]
extends = target_esp32
build_type = debug
build_flags =
  -DCORE_DEBUG_LEVEL=5
  -DDEBUG=1
